services:
  - type: web
    name: suit-elans-erp
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 2 -k uvicorn.workers.UvicornWorker app.main:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: true
      - key: ADMIN_EMAIL
        value: admin@suitelans.mx
      - key: ADMIN_PASSWORD
        generateValue: true
