services:
  web:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://suit:suit@db:5432/suitelans
      COOKIE_SECURE: "false"
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: suit
      POSTGRES_PASSWORD: suit
      POSTGRES_DB: suitelans
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
