[alembic]
script_location = alembic
# Fallback relativo al proyecto (sin rutas absolutas). La URL efectiva se
# resuelve en alembic/env.py: $DATABASE_URL > app config (.env) > esta línea.
# Ejecutar siempre desde la raíz del proyecto.
sqlalchemy.url = sqlite:///./suit_elans_dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
