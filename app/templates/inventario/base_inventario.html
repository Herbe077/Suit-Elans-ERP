{% extends "base.html" %}
{% block content %}
<div class="hidden sm:flex gap-2 mb-4 text-sm border-b border-[#C5A880]/40 pb-2">
  <a href="/inventario/catalogo" class="px-3 py-1.5 rounded-lg whitespace-nowrap {{ 'bg-borgo text-white' if request.url.path.startswith('/inventario/catalogo') else 'hover:bg-white' }} font-bold">🧵 Catálogo</a>
  <a href="/inventario/almacen" class="px-3 py-1.5 rounded-lg whitespace-nowrap {{ 'bg-borgo text-white' if request.url.path.startswith('/inventario/almacen') else 'hover:bg-white' }} font-bold">📦 Almacén</a>
  <a href="/inventario/compras" class="px-3 py-1.5 rounded-lg whitespace-nowrap {{ 'bg-borgo text-white' if request.url.path.startswith('/inventario/compras') else 'hover:bg-white' }} font-bold">🧾 Compras</a>
</div>
<select onchange="if(this.value) location.href=this.value" class="block sm:hidden w-full text-sm border rounded-lg px-3 py-2 mb-3 bg-white" aria-label="Sección de inventario">
  <option value="/inventario/catalogo" {% if request.url.path.startswith('/inventario/catalogo') %}selected{% endif %}>🧵 Catálogo</option>
  <option value="/inventario/almacen" {% if request.url.path.startswith('/inventario/almacen') %}selected{% endif %}>📦 Almacén</option>
  <option value="/inventario/compras" {% if request.url.path.startswith('/inventario/compras') %}selected{% endif %}>🧾 Compras</option>
</select>
{% block inventario %}{% endblock %}
{% endblock %}
