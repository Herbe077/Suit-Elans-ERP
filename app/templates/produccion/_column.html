<div class="min-w-[240px] w-64 shrink-0 bg-slate-200/60 rounded-xl p-2" id="colbox-{{ key }}" {% if oob %}hx-swap-oob="true"{% endif %}>
  <h2 class="font-bold text-xs uppercase tracking-wide px-1 py-1">{{ label }} <span class="text-slate-500">({{ cards|length }})</span></h2>
  <div class="space-y-2" data-cards="{{ key }}">
    {% for card in cards %}{% include "produccion/_card.html" %}{% endfor %}
  </div>
</div>
