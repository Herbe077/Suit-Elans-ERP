<div class="bg-white rounded-xl shadow border border-[#C5A880]/30" id="accbox-{{ key }}" {% if oob %}hx-swap-oob="true"{% endif %}>
  <div x-data="{ open: true }">
    <button @click="open = !open" class="w-full flex items-center justify-between px-3 py-2.5 text-sm font-bold">
      <span>{{ label }} <span class="font-normal text-slate-400">({{ cards|length }})</span></span>
      <span x-text="open ? '▾' : '▸'" class="text-laton-dark"></span>
    </button>
    <div x-show="open" class="px-2 pb-2 space-y-2">
      {% for card in cards %}{% set pfx = 'm' %}{% include "produccion/_card.html" %}{% endfor %}
    </div>
  </div>
</div>
