{# Modal base Alpine.js — sin recarga #}
{% macro modal(id, title="") -%}
<div x-data="{ open: false }" x-show="open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4" style="display:none" id="{{ id }}-wrap">
  <div class="absolute inset-0 bg-[#1F1112]/60" @click="open=false"></div>
  <div class="relative bg-[#FAF8F5] rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto border-2" style="border-color:#C5A880">
    <div class="flex items-center justify-between px-4 py-3 border-b" style="border-color:#C5A880/30">
      <h3 class="font-bold" style="color:#370003">{{ title }}</h3>
      <button @click="open=false" class="text-slate-500 hover:text-[#370003]">✕</button>
    </div>
    <div class="p-4">
      {{ caller() }}
    </div>
  </div>
</div>
{%- endmacro %}
